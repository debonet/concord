<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 575" role="img" aria-labelledby="title desc">
  <title id="title">ConcordSTC relationships between human intent, specifications, tests, and code</title>
  <desc id="desc">Specifications derive from recorded human intent. Specification statements may derive from other spec statements. Code implements specifications and points to tests; tests prove specification statements.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#087e8b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#16324f" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect x="10" y="10" width="880" height="555" rx="28" fill="#f2f7fa"/>

  <g fill="none" stroke="#087e8b" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M 450 210 L 450 102"/>
    <path d="M 300 425 L 405 318"/>
    <path d="M 600 425 L 495 318"/>
    <path d="M 330 479 L 570 479"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g filter="url(#shadow)">
      <rect x="325" y="20" width="250" height="82" rx="20" fill="#fff4e5" stroke="#d3a457" stroke-width="2"/>
      <rect x="325" y="210" width="250" height="108" rx="20" fill="#ffffff" stroke="#087e8b" stroke-width="3"/>
      <rect x="55" y="425" width="275" height="108" rx="20" fill="#ffffff" stroke="#5c7890" stroke-width="2"/>
      <rect x="570" y="425" width="275" height="108" rx="20" fill="#ffffff" stroke="#5c7890" stroke-width="2"/>
    </g>
    <g text-anchor="middle">
      <text x="450" y="56" fill="#12304a" font-size="21" font-weight="750" letter-spacing=".5">HUMAN INTENT</text>
      <text x="450" y="82" fill="#52697d" font-size="15">preserved verbatim</text>

      <text x="450" y="256" fill="#12304a" font-size="23" font-weight="750" letter-spacing="1">SPEC</text>
      <text x="450" y="289" fill="#52697d" font-size="16">standalone contract</text>

      <text x="192.5" y="471" fill="#12304a" font-size="22" font-weight="750">CODE</text>
      <text x="192.5" y="502" fill="#52697d" font-size="16">implementation</text>

      <text x="707.5" y="471" fill="#12304a" font-size="22" font-weight="750">TEST</text>
      <text x="707.5" y="502" fill="#52697d" font-size="16">verification</text>
    </g>

    <g font-size="14" font-weight="700" fill="#075b68" text-anchor="middle">
      <rect x="377" y="140" width="146" height="32" rx="16" fill="#ffffff" stroke="#c6e2e5"/>
      <text x="450" y="161">derived-from</text>
      <rect x="290" y="356" width="128" height="30" rx="15" fill="#ffffff" stroke="#c6e2e5"/>
      <text x="354" y="376">implements</text>
      <rect x="498" y="356" width="100" height="30" rx="15" fill="#ffffff" stroke="#c6e2e5"/>
      <text x="548" y="376">proves</text>
      <rect x="387" y="464" width="126" height="30" rx="15" fill="#ffffff" stroke="#c6e2e5"/>
      <text x="450" y="484">tested-by</text>
    </g>
  </g>
</svg>
