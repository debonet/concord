<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 290" role="img" aria-labelledby="title desc">
  <title id="title">Four guarantees of Concord</title>
  <desc id="desc">Preservation: human intent and decisions become durable specs with their origins recorded; new work starts from intent, not guesses. Verification: tests point to statements they verify, code points to what it implements and tests that check it, and stale links or missing evidence surface. Comprehensiveness: coverage exposes specs lacking tests or code, and code lacking spec or test links, making rogue code visible. Consistency: agents update specs before implementation, and the checker and commit gate catch drift as the project changes.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="145%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#15334f" flood-opacity=".1"/>
    </filter>
  </defs>
  <g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">
    <g filter="url(#shadow)">
      <rect x="20" y="20" width="290" height="250" rx="22" fill="#fff4e5" stroke="#e5b96d" stroke-width="2"/>
      <rect x="330" y="20" width="290" height="250" rx="22" fill="#e8f5f2" stroke="#79b7aa" stroke-width="2"/>
      <rect x="640" y="20" width="290" height="250" rx="22" fill="#edf3ff" stroke="#91aede" stroke-width="2"/>
      <rect x="950" y="20" width="290" height="250" rx="22" fill="#f3eefb" stroke="#ad98ce" stroke-width="2"/>
    </g>

    <g fill="#17344b" font-size="21" font-weight="750" letter-spacing=".4">
      <text x="165" y="75">PRESERVATION</text>
      <text x="475" y="75">VERIFICATION</text>
      <text x="785" y="75">COMPREHENSIVENESS</text>
      <text x="1095" y="75">CONSISTENCY</text>
    </g>
    <g stroke-width="2.5" stroke-linecap="round">
      <line x1="98" y1="90" x2="232" y2="90" stroke="#b87820"/>
      <line x1="408" y1="90" x2="542" y2="90" stroke="#287e70"/>
      <line x1="718" y1="90" x2="852" y2="90" stroke="#4f73b1"/>
      <line x1="1028" y1="90" x2="1162" y2="90" stroke="#765ba4"/>
    </g>
    <g fill="#344d62" font-size="17">
      <text x="165" y="132">
        <tspan x="165">Human intent and decisions</tspan>
        <tspan x="165" dy="25">become durable specs, with</tspan>
        <tspan x="165" dy="25">origins recorded. New work</tspan>
        <tspan x="165" dy="25">starts from intent, not guesses.</tspan>
      </text>
      <text x="475" y="132">
        <tspan x="475">Tests point to the statements</tspan>
        <tspan x="475" dy="25">they verify. Code points to</tspan>
        <tspan x="475" dy="25">what it implements and tests</tspan>
        <tspan x="475" dy="25">that check it. Gaps surface.</tspan>
      </text>
      <text x="785" y="132">
        <tspan x="785">Coverage exposes specs lacking</tspan>
        <tspan x="785" dy="25">tests or code, and code lacking</tspan>
        <tspan x="785" dy="25">spec or test links—making</tspan>
        <tspan x="785" dy="25">rogue code visible.</tspan>
      </text>
      <text x="1095" y="132">
        <tspan x="1095">Agents update specs before</tspan>
        <tspan x="1095" dy="25">implementation. Checker and</tspan>
        <tspan x="1095" dy="25">commit gate catch drift as the</tspan>
        <tspan x="1095" dy="25">project changes.</tspan>
      </text>
    </g>
  </g>
</svg>
